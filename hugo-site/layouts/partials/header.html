<nav class="navbar">
    <div class="container">
        <div class="nav-brand">
            <a href="{{ .Site.BaseURL }}"><h1>{{ .Site.Title }}</h1></a>
        </div>
        <ul class="nav-menu">
            {{ range .Site.Menus.primary }}
            <li>
                <a href="{{ .URL }}" {{ if $.IsMenuCurrent "primary" . }}class="active"{{ end }}>
                    {{ .Name }}
                </a>
            </li>
            {{ end }}
        </ul>
    </div>
</nav>
