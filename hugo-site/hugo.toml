baseURL = 'https://example.com/'
languageCode = 'en-us'
title = 'WebIsForGames'

# LotusDoc theme via Hugo modules
[module]
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    disable = false

[params]
  google_fonts = [
    ["Inter", "300, 400, 600, 700"],
    ["Fira Code", "500, 700"]
  ]

  sans_serif_font = "Inter"
  secondary_font  = "Inter"
  mono_font       = "Fira Code"

  # Logo Configuration
  [params.footer]
    copyright = "© 2026 WebIsForGames. All rights reserved."

[menu]
  [[menu.primary]]
    name = "Home"
    url = "/"
    identifier = "home"
    weight = 5

  [[menu.primary]]
    name = "About"
    url = "/about/"
    identifier = "about"
    weight = 10

  [[menu.primary]]
    name = "Projects"
    url = "/projects/"
    identifier = "projects"
    weight = 20

  [[menu.primary]]
    name = "Roadmap"
    url = "/roadmap/"
    identifier = "roadmap"
    weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "dracula"
